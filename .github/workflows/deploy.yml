name: Deploy labs to GitHub Pages

# Validates labs, assembles the Simspace site with the featured presentation
# callout, and publishes to GitHub Pages.
# Enable Pages first: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate labs
        run: |
          docker pull dockersamples/simspace-authoring:latest
          docker run --rm \
            -v "${{ github.workspace }}/labs:/labs:ro" \
            dockersamples/simspace-authoring:latest \
            npm run validate-lab -- /labs

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble static site
        run: |
          test -f public/config.json
          test -f scripts/assemble-site.sh
          chmod +x scripts/assemble-site.sh
          docker pull dockersamples/simspace:latest
          docker pull dockersamples/simspace-authoring:latest
          RUNTIME_IMAGE=dockersamples/simspace:latest \
          AUTHORING_IMAGE=dockersamples/simspace-authoring:latest \
          ./scripts/assemble-site.sh "${{ github.workspace }}/site" "${{ github.workspace }}/labs"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  check-pages:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check GitHub Pages is enabled
        id: check
        uses: actions/github-script@60a0d83039c673a2365e4dcb4b0e432b8b7cf8dc # v7.0.1
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput("available", "true");
            } catch (error) {
              core.notice(
                "GitHub Pages is not enabled for this repository. " +
                  "Settings → Pages → Build and deployment → Source: GitHub Actions. " +
                  "Private repos need a GitHub plan that includes Pages."
              );
              core.setOutput("available", "false");
            }

  deploy:
    needs: [build, check-pages]
    if: needs.check-pages.outputs.available == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
