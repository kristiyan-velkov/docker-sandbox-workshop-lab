version: "2.0"

metadata:
  id: lab-02-network-policy
  title: "Lab 2 — Network Policy"
  summary: "Network deny-by-default, allow rules, audit log."

state:
  policyInit: false
  sandboxRunning: false
  network:
    dockerfrontendAllowed: false
    dockerfrontendDenied: false
    allowRuleRemoved: false

settings:
  pace:
    beat: 300

defaults:
  unmatched:
    stderr: ["Error: that command isn't part of this lab yet."]
    exit: 1

scenarios:
  - id: policy-init
    completes: policy-init
    when:
      command: [sbx, policy, init, balanced]
    then:
      state: { policyInit: true }
      output:
        - 'Global network policy initialized to "balanced".'

  - id: policy-ls
    when:
      command: [sbx, policy, ls]
    then:
      output:
        - "POLICY                                 SOURCE   APPLIES TO                  SUMMARY"
        - "local-policy                           local    all                         network: 187 allow; filesystem read: 1 allow; filesystem write: 1 allow"

  - id: sbx-run-lab2
    when:
      command: [sbx, run, cursor, .]
      args:
        --name: lab2
      terminal: sandbox
    then:
      state: { sandboxRunning: true }
      output:
        - "Creating sandbox lab2..."
        - "Sandbox lab2 started successfully"
        - ""
        - "AI: waiting for some question"

  - id: sbx-run-lab2-name-first
    when:
      command: [sbx, run, cursor, ., --name, lab2]
      terminal: sandbox
    then:
      state: { sandboxRunning: true }
      output:
        - "Creating sandbox lab2..."
        - "Sandbox lab2 started successfully"
        - ""
        - "AI: waiting for some question"

  - id: prompt-curl-blocked
    completes: curl-blocked
    when:
      command: [curl]
      promptContains: ["dockerfrontend"]
      state: { network.dockerfrontendAllowed: false }
    then:
      output:
        - "$ curl -sS https://www.dockerfrontend.com"
        - "curl: (7) Failed to connect to www.dockerfrontend.com port 443 after 1 ms: Couldn't connect to server"
        - ""
        - "Blocked by network policy — default deny is working."

  - id: prompt-policy-log-blocked
    when:
      command: [Show]
      promptContains: ["policy", "log", "lab2"]
      state: { network.dockerfrontendAllowed: false }
    then:
      output:
        - "TIME                  SANDBOX  HOST                       DECISION  RULE"
        - "2026-09-16T14:01:02Z  lab2     www.dockerfrontend.com     deny      default-deny"

  - id: policy-log-cmd
    when:
      command: [sbx, policy, log]
      args:
        0: lab2
      state: { network.dockerfrontendAllowed: false }
    then:
      output:
        - "TIME                  SANDBOX  HOST                       DECISION  RULE"
        - "2026-09-16T14:01:02Z  lab2     www.dockerfrontend.com     deny      default-deny"

  - id: policy-allow
    when:
      command: [sbx, policy, allow, network, www.dockerfrontend.com]
    then:
      state:
        network.dockerfrontendAllowed: true
        network.allowRuleRemoved: false
        network.dockerfrontendDenied: false
      output:
        - "Rule added to policy local (scope: global): 04919ce7-7e35-47f6-a907-61c125f6001f (www.dockerfrontend.com)"

  - id: prompt-curl-allowed
    completes: curl-allowed
    when:
      command: [curl]
      promptContains: ["dockerfrontend"]
      state: { network.dockerfrontendAllowed: true, network.dockerfrontendDenied: false }
    then:
      output:
        - "Confirmed allowed. Status is HTTP 200 (not 403)."
        - ""
        - "  Response headers"
        - ""
        - "  HTTP/1.0 200 Connection established"

  - id: agent-curl-allowed
    completes: curl-allowed
    when:
      agent: true
      terminal: sandbox
      promptContains: ["dockerfrontend"]
      state: { network.dockerfrontendAllowed: true, network.dockerfrontendDenied: false }
    then:
      output:
        - "Confirmed allowed. Status is HTTP 200 (not 403)."
        - ""
        - "  Response headers"
        - ""
        - "  HTTP/1.0 200 Connection established"

  - id: prompt-policy-log-full
    when:
      command: [Show]
      promptContains: ["policy", "log", "lab2"]
      state: { network.dockerfrontendAllowed: true, network.dockerfrontendDenied: false }
    then:
      output:
        - "TIME                  SANDBOX  HOST                       DECISION  RULE"
        - "2026-09-16T14:01:02Z  lab2     www.dockerfrontend.com     deny      default-deny"
        - "2026-09-16T14:03:11Z  lab2     www.dockerfrontend.com     allow     user"

  - id: policy-log-cmd-full
    when:
      command: [sbx, policy, log]
      args:
        0: lab2
      state: { network.dockerfrontendAllowed: true, network.dockerfrontendDenied: false }
    then:
      output:
        - "TIME                  SANDBOX  HOST                       DECISION  RULE"
        - "2026-09-16T14:01:02Z  lab2     www.dockerfrontend.com     deny      default-deny"
        - "2026-09-16T14:03:11Z  lab2     www.dockerfrontend.com     allow     user"

  - id: policy-deny-global-conflict
    completes: deny-conflict
    when:
      command: [sbx, policy, deny, network]
      args:
        0: www.dockerfrontend.com
      state: { network.dockerfrontendAllowed: true }
    then:
      stderr:
        - "ERROR: deny network rule: deny:"
        - '  "www.dockerfrontend.com" conflicts with existing allow rule "04919ce7-7e35-47f6-a907-61c125f6001f" (name "04919ce7-7e35-47f6-a907-61c125f6001f")'
      exit: 1

  - id: policy-rm-resource
    completes: rm-allow-rule
    when:
      command: [sbx, policy, rm, network]
      args:
        --resource: www.dockerfrontend.com
    then:
      state:
        network.dockerfrontendAllowed: false
        network.allowRuleRemoved: true
        network.dockerfrontendDenied: false
      output:
        - "Rule removed from policy local: resources=www.dockerfrontend.com"

  - id: policy-deny-global
    completes: deny-global
    when:
      command: [sbx, policy, deny, network]
      args:
        0: www.dockerfrontend.com
      state:
        {
          network.allowRuleRemoved: true,
          network.dockerfrontendDenied: false,
        }
    then:
      state:
        network.dockerfrontendDenied: true
      output:
        - "Rule added to policy local (scope: global): 841c1935-dfc6-4829-b548-51a4e71ea6b6 (www.dockerfrontend.com)"

  - id: prompt-curl-blocked-denied
    when:
      command: [curl]
      promptContains: ["dockerfrontend"]
      state: { network.dockerfrontendDenied: true }
    then:
      output:
        - "$ curl -sS https://www.dockerfrontend.com"
        - "curl: (7) Failed to connect to www.dockerfrontend.com port 443 after 1 ms: Couldn't connect to server"
        - ""
        - "Blocked by network policy — global deny is active."

  - id: agent-curl-blocked-denied
    when:
      agent: true
      terminal: sandbox
      promptContains: ["dockerfrontend"]
      state: { network.dockerfrontendDenied: true }
    then:
      output:
        - "$ curl -sS https://www.dockerfrontend.com"
        - "curl: (7) Failed to connect to www.dockerfrontend.com port 443 after 1 ms: Couldn't connect to server"
        - ""
        - "Blocked by network policy — global deny is active."

  - id: policy-rm
    when:
      command: [sbx, policy, rm, network]
    then:
      stderr:
        - "Specify a resource to remove:"
        - "  sbx policy rm network --resource www.dockerfrontend.com"
      exit: 1

  - id: sbx-rm-lab2
    completes: cleanup
    when:
      command: [sbx, rm, lab2]
      args:
        --force: { any: true }
    then:
      state: { sandboxRunning: false }
      output:
        - "Deleting sandbox lab2..."
        - "Sandbox 'lab2' removed"
