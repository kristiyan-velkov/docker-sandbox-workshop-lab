title: "Lab 1 — Your First Sandbox"
description: "Install sbx, run your first agent, prove workspace isolation, and remove the sandbox."

catalog:
  icon: rocket_launch
  tags: ["github", "sbx", "getting started"]
  estimatedMinutes: 25
  order: 1

simulator: simulator.yaml

terminals:
  - id: host
    title: Host
    icon: dns

files:
  delete-me.txt: |
    This file lives OUTSIDE the synced workspace.
    The sandbox should NOT be able to delete it.
  workspace/.keep: ""

sections:
  - title: Introduction
    contentPath: 00-intro.md
  - title: Install and sign in
    contentPath: 01-install.md
    steps:
      - id: sbx-install
        title: "Install sbx with Homebrew"
      - id: sbx-login
        title: "Sign in with sbx login"
      - id: sbx-version
        title: "Check sbx version"
  - title: First run
    contentPath: 02-run.md
    steps:
      - id: sbx-run
        title: "Start first sandbox"
      - id: hello-chat
        title: "Simple hello prompt"
      - id: hello-file
        title: "Create hello.txt"
  - title: Workspace boundary
    contentPath: 03-boundary.md
    steps:
      - id: boundary-test
        title: "Confirm delete-me.txt is outside the sandbox"
  - title: Clean up
    contentPath: 04-cleanup.md
    steps:
      - id: useful-ls
        title: "List sandboxes"
      - id: cleanup
        title: "Remove the sandbox"
